name: Sync Merged Ad Rules

on:
  schedule:
    # 每天 UTC 02:21 自动运行（北京时间约 10:21），可随意调整
    - cron: '21 2 * * *'
  push:
    branches: [main]
    # 仅当合并逻辑/转换逻辑/工作流本身变更时才重跑，避免自动提交造成循环
    paths:
      - 'merge.py'
      - 'to_loon.py'
      - '.github/workflows/sync.yml'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点 “Run workflow” 立即触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge & dedupe rules
        run: python merge.py

      - name: Generate Loon rules
        run: python to_loon.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged.txt loon.txt loon_exemptions.txt
          if git diff --cached --quiet; then
            echo "规则无变化，跳过提交"
          else
            git commit -m "chore: auto-sync merged rules + loon rules $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
