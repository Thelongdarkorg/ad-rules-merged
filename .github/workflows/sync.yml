name: Sync Merged Ad Rules

on:
  schedule:
    - cron: '21 2 * * *'
  push:
    branches: [main]
    paths:
      - 'merge.py'
      - '.github/workflows/sync.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge & dedupe rules
        run: python merge.py
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add merged.txt
          if git diff --cached --quiet; then
            echo "规则无变化，跳过提交"
          else
            git commit -m "chore: auto-sync merged rules $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
